<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>넥스트 커리어 페어 - 멘토링 지원자 정보</title>
<style>
  :root {
    --ink:      #171719;
    --body:     rgba(23,23,25,0.88);
    --sub:      rgba(55,56,60,0.7);
    --border:   rgba(55,56,60,0.28);
    --line:     rgba(55,56,60,0.14);
    --green:    #61DD79;
    --blue:     #60BAF2;
    --required: #D14343;
  }
  * { box-sizing: border-box; word-break: keep-all; }
  button:focus-visible, [tabindex]:focus-visible, .chip:focus-visible, .card:focus-visible {
    outline: 2px solid var(--green); outline-offset: 2px;
  }
  body {
    margin: 0;
    font-family: 'Pretendard Variable', Pretendard, sans-serif;
    background: #FAFAFA;
    color: var(--body);
    -webkit-font-smoothing: antialiased;
  }

  /* 로그인 화면 */
  .login-wrap {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .login-card {
    width: 100%; max-width: 360px; padding: 32px;
    background: #fff; border: 1px solid var(--border); border-radius: 4px;
  }
  .login-logo { display: block; margin: 0 0 14px; }
  .login-card h1 {
    font-size: 20px; font-weight: 600; letter-spacing: -0.15px;
    color: var(--ink); margin: 0 0 24px;
  }
  .topbar-logo { display: block; flex-shrink: 0; }
  .login-field { margin-bottom: 12px; }
  .login-field label {
    display: block; font-size: 14px; font-weight: 600; letter-spacing: 0.203px;
    color: var(--ink); margin-bottom: 8px;
  }
  .login-field input {
    width: 100%; height: 48px; padding: 0 14px;
    font-family: inherit; font-size: 16px; font-weight: 400; letter-spacing: -0.05px; line-height: 1.4;
    color: var(--ink);
    background: #fff; border: 1px solid var(--border); border-radius: 4px; outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .login-field input:focus {
    border-color: var(--ink); box-shadow: 0 0 0 3px rgba(97,221,121,0.12);
  }
  .login-error {
    display: none; font-size: 13px; color: var(--required);
    margin: 4px 0 12px;
  }
  .login-submit {
    width: 100%; height: 48px; margin-top: 8px; border: none; border-radius: 4px;
    background: var(--green); color: #fff; font-family: inherit;
    font-size: 16px; font-weight: 600; letter-spacing: 0.091px; cursor: pointer;
  }
  .login-submit:disabled { opacity: 0.5; cursor: default; }

  /* 대시보드 상단바 */
  .topbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 24px; background: #fff; border-bottom: 1px solid var(--line);
  }
  .topbar h1 { font-size: 18px; font-weight: 600; letter-spacing: -0.05px; color: var(--ink); margin: 0; }
  .topbar .who { font-size: 13px; color: var(--sub); margin-left: 12px; }
  .logout-btn {
    height: 40px; padding: 0 16px; border-radius: 4px; border: 1px solid var(--border);
    background: #fff; color: var(--ink); font-family: inherit;
    font-size: 14px; font-weight: 500; letter-spacing: -0.05px;
    cursor: pointer; transition: border-color 0.15s, background 0.15s;
  }
  .logout-btn:hover { border-color: var(--ink); background: rgba(55,56,60,0.04); }

  .main { max-width: 1240px; margin: 0 auto; padding: 24px; }

  .main-content { flex: 1; min-width: 0; }

  @media (max-width: 720px) {
    .main { flex-direction: column; }
  }


  /* 필터 + 요약 */
  .toolbar {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-start;
    gap: 12px; margin-bottom: 20px;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border); background: #fff;
    font-size: 16px; font-weight: 400; letter-spacing: -0.05px; line-height: 1.4; color: var(--ink);
    cursor: pointer; user-select: none; transition: all 0.15s;
  }
  .chip.active { background: var(--green); border-color: var(--green); color: #fff; font-weight: 500; }
  .count { font-size: 13px; font-weight: 500; color: var(--sub); white-space: nowrap; }
  .live-dot {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: var(--green); margin-right: 8px;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

  /* 보기 방식 토글 (썸네일/목록) */
  .toolbar-right { display: flex; align-items: center; gap: 12px; margin-left: auto; }
  .xlsx-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 9px 14px; border-radius: 4px; border: 1px solid var(--border); background: #fff;
    font-family: 'Pretendard Variable', Pretendard, sans-serif; font-size: 13px; font-weight: 600;
    color: var(--ink); cursor: pointer; transition: border-color 0.15s, background 0.15s;
  }
  .xlsx-btn:hover { border-color: var(--green); background: rgba(97,221,121,0.06); }
  .chip--mentor.active { background: var(--green); border-color: var(--green); color: #fff; font-weight: 500; }
  .view-toggle {
    display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0;
  }
  .view-toggle-btn {
    display: flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; border: none; border-radius: 8px; background: transparent; color: var(--sub);
    cursor: pointer; transition: background 0.15s, color 0.15s;
  }
  .view-toggle-btn:hover { background: rgba(55,56,60,0.06); }
  .view-toggle-btn.active { background: rgba(97,221,121,0.08); color: var(--green); }

  .cards.thumbs-off .card-thumb-wrap { display: none; }
  /* 목록형: 격자 카드가 아니라 세로로 쌓이는 진짜 리스트로 전환 - 1줄 이름, 2줄 분야+멘토정보, 3줄 자기소개 */
  .cards.thumbs-off {
    display: flex; flex-direction: column; gap: 8px;
  }
  .cards.thumbs-off .card:hover { transform: none; box-shadow: none; }
  .cards.thumbs-off .card-body { padding: 16px 20px; display: block; }
  .cards.thumbs-off .card-head { margin-bottom: 8px; }
  .cards.thumbs-off .card-meta { display: inline; padding-top: 0; border-top: none; margin-left: 8px; }
  .cards.thumbs-off .card-chips { display: inline-flex; vertical-align: middle; margin-bottom: 0; }
  .cards.thumbs-off .card-summary {
    margin-top: 8px; margin-left: 12px; color: var(--sub);
  }

  /* 카드 리스트 - 여러 명이 한 화면에 보이도록 그리드로 배치 */
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 12px;
  }
  .card {
    background: #fff; border: 1px solid var(--border); border-radius: 4px; overflow: hidden;
    cursor: pointer;
    transition: box-shadow 0.18s ease, border-color 0.18s ease, transform 0.18s ease;
  }
  .card:hover {
    box-shadow: 0 4px 16px rgba(23,23,25,0.06);
    border-color: rgba(55,56,60,0.4);
    transform: translateY(-1px);
  }
  .card-thumb-wrap {
    aspect-ratio: 4 / 3; background: #F0F0F1; overflow: hidden;
  }
  .card-thumb {
    width: 100%; height: 100%; object-fit: cover; object-position: top; display: block;
  }
  .card-thumb--empty {
    width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    font-size: 12px; font-weight: 500; color: rgba(55,56,60,0.35);
  }
  .card-thumb--empty svg { color: rgba(55,56,60,0.28); }
  .card-body { padding: 16px; display: flex; flex-direction: column; }
  .card-head { order: 0; }
  .card-chips { order: 1; }
  .card-summary { order: 2; }
  .card-meta { order: 3; }
  .card-head {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 8px;
  }
  .badge--year { background: #fff; border: 1px solid var(--border); color: var(--ink); }
  .card-name {
    flex: 1; min-width: 0;
    font-size: 15px; font-weight: 600; letter-spacing: -0.05px; color: var(--ink);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .card-summary {
    margin-top: 8px; margin-left: 12px;
    font-size: 12px; font-weight: 500; color: var(--sub);
    line-height: 1.5;
    overflow: hidden; text-overflow: ellipsis;
    display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical;
  }
  .card-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .tag {
    font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 20px;
    background: rgba(97,221,121,0.08); color: var(--green);
  }
  .card-meta {
    font-size: 12px; font-weight: 500; color: var(--sub);
    padding-top: 12px; border-top: 1px solid var(--line);
  }

  .card-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px 24px;
    font-size: 13px; margin-bottom: 8px;
  }
  .card-grid dt { color: var(--sub); }
  .card-grid dd { margin: 0; color: var(--ink); font-weight: 500; word-break: break-all; }

  .card-text { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
  .card-text dt { font-size: 12px; font-weight: 600; color: var(--sub); margin-bottom: 4px; }
  .card-text dd { margin: 0 0 10px; font-size: 13px; line-height: 1.6; color: var(--ink); white-space: pre-line; }
  .card-text dd:last-child { margin-bottom: 0; }

  /* 이력서 미리보기 트리거 — 신청서 페이지의 filebox/badge 패턴과 통일 */
  .card-attach {
    margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line);
    display: flex; flex-direction: column; gap: 8px;
  }
  .attach-summary {
    font-size: 13px; font-weight: 500; color: var(--sub);
  }
  .attach-box {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 16px; border: none; border-radius: 4px; background: rgba(55,56,60,0.04);
  }
  .attach-file {
    display: flex; align-items: center; gap: 12px; min-width: 0;
  }
  .badge {
    flex-shrink: 0; font-size: 11px; font-weight: 600; letter-spacing: -0.05px;
    padding: 4px 8px; border-radius: 20px;
  }
  .badge--file { background: rgba(55,56,60,0.06); color: var(--sub); }
  .attach-info { min-width: 0; }
  .attach-info .fname {
    display: block; font-size: 14px; font-weight: 500; letter-spacing: -0.05px; color: var(--ink);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .resume-btn {
    flex-shrink: 0; display: inline-flex; align-items: center; gap: 8px;
    height: 40px; padding: 0 16px; border-radius: 4px; border: 1px solid var(--border);
    background: #fff; color: var(--ink); font-family: inherit; font-size: 14px; font-weight: 500; letter-spacing: -0.05px;
    cursor: pointer; transition: border-color 0.15s, background 0.15s, color 0.15s;
  }
  .resume-btn:hover { border-color: var(--green); background: rgba(97,221,121,0.06); color: var(--green); }
  .resume-btn svg { flex-shrink: 0; }
  .resume-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .attach-actions { flex-shrink: 0; display: flex; gap: 8px; }
  a.resume-btn { text-decoration: none; }

  .download-all-btn {
    width: 100%; height: 40px; margin-top: 4px;
    border-radius: 4px; border: 1px solid var(--border); background: #fff;
    color: var(--ink); font-family: inherit; font-size: 14px; font-weight: 500; letter-spacing: -0.05px;
    cursor: pointer; transition: border-color 0.15s, background 0.15s, color 0.15s;
  }
  .download-all-btn:hover { border-color: var(--green); background: rgba(97,221,121,0.06); color: var(--green); }

  .empty {
    text-align: center; padding: 60px 20px; color: var(--sub); font-size: 14px;
  }

  /* 이력서 미리보기 모달 */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(23,23,25,0.28);
    backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
    display: flex; align-items: center; justify-content: center; padding: 20px;
    opacity: 0; visibility: hidden;
    transition: opacity 0.18s ease, visibility 0.18s;
  }
  .modal-overlay.open { opacity: 1; visibility: visible; }
  .modal-box {
    width: 100%; max-width: 640px; max-height: 86vh;
    display: flex; flex-direction: column;
    background: #fff; border-radius: 8px; overflow: hidden;
    box-shadow: 0 12px 40px rgba(23,23,25,0.18);
    transform: scale(0.96) translateY(6px);
    transition: transform 0.22s cubic-bezier(0.2, 0.8, 0.3, 1);
  }
  .modal-overlay.open .modal-box { transform: scale(1) translateY(0); }
  @media (prefers-reduced-motion: reduce) {
    .modal-overlay, .modal-box { transition: none; }
  }
  .modal-head {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 16px 20px; border-bottom: 1px solid var(--line);
  }
  .modal-head-info { min-width: 0; }
  .modal-title { font-size: 15px; font-weight: 600; letter-spacing: -0.05px; color: var(--ink); }
  .modal-sub { font-size: 12px; color: var(--sub); margin-top: 4px; }
  .modal-close {
    flex-shrink: 0; width: 32px; height: 32px; border-radius: 4px; border: none;
    background: transparent; color: var(--sub); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  .modal-close:hover { background: rgba(55,56,60,0.06); color: var(--ink); }

  .modal-body {
    flex: 1; overflow: auto; background: #F4F4F5;
    display: flex; align-items: center; justify-content: center; padding: 0;
    min-height: 360px;
  }
  .modal-body:has(.modal-placeholder) { padding: 32px; }
  .modal-pdf { width: 100%; height: 70vh; min-height: 360px; border: none; display: block; }
  .modal-placeholder { text-align: center; }
  .doc-page {
    width: 176px; margin: 0 auto 18px; padding: 24px 20px;
    background: #fff; border: 1px solid var(--border); border-radius: 4px;
    box-shadow: 0 2px 10px rgba(23,23,25,0.05);
  }
  .doc-line {
    height: 7px; border-radius: 4px; margin-bottom: 8px;
    background: linear-gradient(90deg, #ECECEE 25%, #F6F6F7 37%, #ECECEE 63%);
    background-size: 400% 100%; animation: docShimmer 2.4s ease-in-out infinite;
  }
  .doc-line--name {
    height: 11px; width: 64%; margin-bottom: 8px;
    background: linear-gradient(90deg, #D9D9DB 25%, #E7E7E9 37%, #D9D9DB 63%);
    background-size: 400% 100%;
  }
  .doc-line--title { width: 42%; margin-bottom: 16px; }
  .doc-divider { height: 1px; background: var(--line); margin-bottom: 16px; }
  .doc-line--w50 { width: 50%; }
  .doc-line--w60 { width: 60%; }
  .doc-line--w70 { width: 70%; }
  .doc-line--w80 { width: 80%; }
  .doc-line--w90 { width: 90%; }
  .doc-line--w95 { width: 95%; }
  .doc-gap { height: 6px; margin-bottom: 0; background: none; animation: none; }
  @keyframes docShimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
  .ph-caption {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    max-width: 320px; margin: 0 auto; padding: 12px 16px;
    background: rgba(55,56,60,0.04); border-radius: 4px;
    font-size: 13px; font-weight: 500; line-height: 1.55; color: var(--sub);
  }
  .ph-caption svg { flex-shrink: 0; margin-top: -1px; }
  @media (prefers-reduced-motion: reduce) {
    .doc-line { animation: none; }
  }

  .modal-foot {
    display: flex; align-items: center; justify-content: flex-end; gap: 8px;
    padding: 12px 20px; border-top: 1px solid var(--line);
  }
  .modal-btn {
    height: 40px; padding: 0 16px; border-radius: 4px; font-family: inherit;
    font-size: 14px; font-weight: 500; letter-spacing: -0.05px; cursor: pointer; border: 1px solid var(--border);
    background: #fff; color: var(--ink);
  }
  .modal-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .modal-btn--primary { background: var(--green); border-color: var(--green); color: #fff; }
  .modal-btn--primary:disabled { background: var(--green); border-color: var(--green); }

  @media (max-width: 640px) {
    .cards { grid-template-columns: 1fr; }
    .card-grid { grid-template-columns: 1fr; }
    .main { padding: 16px; }
    .topbar { padding: 16px 16px; }
    .card-attach .attach-box { flex-wrap: wrap; }
    .resume-btn { width: 100%; justify-content: center; }
  }
</style>
</head>
<body>

  <!-- 로그인 화면 -->
  <div id="loginScreen" class="login-wrap">

            <button type="button" class="view-toggle-btn active" id="viewGalleryBtn" title="썸네일로 보기" aria-label="썸네일로 보기">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5" fill="currentColor"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5" fill="currentColor"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5" fill="currentColor"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5" fill="currentColor"/></svg>
            </button>
            <button type="button" class="view-toggle-btn" id="viewListBtn" title="목록으로 보기" aria-label="목록으로 보기">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="3" rx="1.5" fill="currentColor"/><rect x="3" y="10.5" width="18" height="3" rx="1.5" fill="currentColor"/><rect x="3" y="16" width="18" height="3" rx="1.5" fill="currentColor"/></svg>
            </button>
          </div>
          <button type="button" class="xlsx-btn" id="xlsxBtn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            엑셀 다운로드
          </button>
        </div>
      </div>

      <div class="cards" id="cardList"></div>
      <div class="empty" id="emptyMsg" style="display:none;">아직 신청자가 없어요</div>
      </div>
    </div>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
  import {
    getFirestore, collection, query, orderBy, onSnapshot
  } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";
  import {
    getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
  } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDTAtAihhSfR5lJLb1IVlLQmjydXYYF-P8",
    authDomain: "nds-careerfair.firebaseapp.com",
    projectId: "nds-careerfair",
    storageBucket: "nds-careerfair.firebasestorage.app",
    messagingSenderId: "648297819688",
    appId: "1:648297819688:web:cf73c1255ec5a76846cf1d",
    measurementId: "G-JVL7Z97HQP"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  // ============================================
  // 로그인 처리
  // ============================================
  const loginScreen = document.getElementById('loginScreen');
  const dashboard = document.getElementById('dashboard');
  const loginForm = document.getElementById('loginForm');
  const loginBtn = document.getElementById('loginBtn');
  const loginError = document.getElementById('loginError');

  loginForm.addEventListener('submit', async function (e) {
    e.preventDefault();
    loginError.style.display = 'none';
    loginBtn.disabled = true;
    loginBtn.textContent = '로그인 중...';

    var email = document.getElementById('loginEmail').value.trim();
    var pw = document.getElementById('loginPw').value;

    try {
      await signInWithEmailAndPassword(auth, email, pw);
      // 이후 화면 전환은 onAuthStateChanged가 처리
    } catch (err) {
      console.error(err);
      loginError.style.display = 'block';
    } finally {
      loginBtn.disabled = false;
      loginBtn.textContent = '로그인';
    }
  });

  document.getElementById('logoutBtn').addEventListener('click', function () {
    signOut(auth);
  });

  let unsubscribeList = null;

  onAuthStateChanged(auth, function (user) {
    if (user) {
      loginScreen.style.display = 'none';
      dashboard.style.display = 'block';
      startRealtimeList();
    } else {
      loginScreen.style.display = 'flex';
      dashboard.style.display = 'none';
      if (unsubscribeList) { unsubscribeList(); unsubscribeList = null; }
    }
  });

  // ============================================
  // 실시간 목록
  // ============================================
  let allApplications = [];
  let activeMentor = '';

  function startRealtimeList() {
    var q = query(collection(db, "applications"), orderBy("createdAt", "desc"));
    unsubscribeList = onSnapshot(q, function (snapshot) {
      allApplications = snapshot.docs.map(function (doc) {
        return Object.assign({ id: doc.id }, doc.data());
      }).filter(function (a) { return !!a.mentor; }); // 멘토링 신청 정보가 있는 지원자만 표시
      render();
    }, function (err) {
      console.error(err);
    });
  }

  document.getElementById('mentorChips').addEventListener('click', function (e) {
    var chip = e.target.closest('.chip');
    if (!chip) return;
    document.querySelectorAll('#mentorChips .chip').forEach(function (c) { c.classList.remove('active'); });
    chip.classList.add('active');
    activeMentor = chip.dataset.mentor;
    render();
  });

  // 엑셀 다운로드 - 지금 선택된 멘토 필터 기준으로, 파일(이력서/포트폴리오/발표자료) 링크는 빼고 나머지 정보만 내보냄
  document.getElementById('xlsxBtn').addEventListener('click', function () {
    var list = getFilteredList();
    if (list.length === 0) {
      alert('다운로드할 지원자가 없어요.');
      return;
    }
    var rows = list.map(function (a) {
      var yearLabel = a.year === '신입' ? '신입' : (a.year ? a.year + '년차' : '');
      return {
        '이름': a.name || '',
        '이메일': a.email || '',
        '연락처': a.phone || '',
        '생년월일': a.birth || '',
        '연차': yearLabel,
        '분야 상세': a.detail || '',
        '경력/학력': a.summary || '',
        '신청 멘토': a.mentor || '',
        '날짜': a.day || '',
        '취업 분야': a.jobField || '',
        '멘토를 선택한 이유': a.reasonMentor || '',
        '멘토링을 신청한 이유': a.reasonApply || ''
      };
    });
    var ws = XLSX.utils.json_to_sheet(rows);
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '멘토링 지원자 목록');
    var filterLabel = activeMentor || '전체';
    var today = new Date().toISOString().slice(0, 10);
    XLSX.writeFile(wb, '넥스트커리어페어_멘토링지원자_' + filterLabel + '_' + today + '.xlsx');
  });

  var viewGalleryBtn = document.getElementById('viewGalleryBtn');
  var viewListBtn = document.getElementById('viewListBtn');
  function setThumbView(showThumb) {
    document.getElementById('cardList').classList.toggle('thumbs-off', !showThumb);
    viewGalleryBtn.classList.toggle('active', showThumb);
    viewListBtn.classList.toggle('active', !showThumb);
  }
  viewGalleryBtn.addEventListener('click', function () { setThumbView(true); });
  viewListBtn.addEventListener('click', function () { setThumbView(false); });

  function esc(str) {
    var div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  // 다운로드 주소에 "이건 다운로드해줘"라는 옵션을 붙여봄 (fetch 실패 시 최후의 수단으로 사용)
  function forceDownloadUrl(url, filename) {
    var sep = url.indexOf('?') === -1 ? '?' : '&';
    return url + sep + 'response-content-disposition=' + encodeURIComponent('attachment; filename="' + filename + '"');
  }

  // 파일 URL에서 실제 확장자를 뽑아내는 함수 (Firebase Storage 다운로드 URL에는
  // 원본 파일명이 그대로 들어있어서, 이걸로 진짜 확장자를 알 수 있음)
  // 이미지/영상 등 PDF가 아닌 파일도 올라올 수 있어서, 무조건 .pdf로 고정하면 안 됨
  function getFileExt(url) {
    try {
      var afterO = url.split('/o/')[1] || '';
      var beforeQuery = afterO.split('?')[0];
      var decoded = decodeURIComponent(beforeQuery);
      var lastSlash = decoded.lastIndexOf('/');
      var fname = lastSlash === -1 ? decoded : decoded.slice(lastSlash + 1);
      var dotIdx = fname.lastIndexOf('.');
      if (dotIdx === -1) return '';
      return fname.slice(dotIdx).toLowerCase();
    } catch (e) {
      return '';
    }
  }

  // 파일을 fetch로 받아 blob으로 바꿔서 다운로드시킴 - 브라우저가 cross-origin
  // 링크의 download 속성을 무시하고 새 탭에 그냥 열어버리는 문제를 우회함
  function downloadFile(url, filename) {
    return fetch(url)
      .then(function (res) {
        if (!res.ok) throw new Error('다운로드 실패');
        return res.blob();
      })
      .then(function (blob) {
        var blobUrl = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = blobUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function () { URL.revokeObjectURL(blobUrl); }, 10000);
      })
      .catch(function (err) {
        console.error(err);
        // fetch가 막히는 경우(CORS 등) 최후의 수단으로 새 탭에서 열기
        window.open(forceDownloadUrl(url, filename), '_blank');
      });
  }

  function buildDetailHtml(a) {
    var textBlock = '';
    if (a.summary) textBlock += '<dt>간단 이력</dt><dd>' + esc(a.summary) + '</dd>';
    if (a.detail) textBlock += '<dt>분야 상세</dt><dd>' + esc(a.detail) + '</dd>';

    var mentorBlock = '';
    if (a.mentor) mentorBlock += '<dt>신청 멘토</dt><dd>' + esc(a.mentor) + (a.day ? ' (' + esc(a.day) + ')' : '') + '</dd>';
    if (a.jobField) mentorBlock += '<dt>취업 분야</dt><dd>' + esc(a.jobField) + '</dd>';
    if (a.reasonMentor) mentorBlock += '<dt>멘토를 선택한 이유</dt><dd>' + esc(a.reasonMentor) + '</dd>';
    if (a.reasonApply) mentorBlock += '<dt>멘토링을 신청한 이유</dt><dd>' + esc(a.reasonApply) + '</dd>';

    // 이력서/포트폴리오/발표자료를 전부 같은 형태의 행(row)으로 만들어서 색상 위계를 통일함
    // 파일이 1개뿐이면 번호 없이, 여러 개일 때만 번호를 붙임
    var fileRows = [];
    if (a.resumeUrl) fileRows.push({ label: a.name + '_이력서' + (getFileExt(a.resumeUrl) || '.pdf'), url: a.resumeUrl, badge: '이력서' });
    (a.portfolioUrls || []).forEach(function (url, idx) {
      var suffix = (a.portfolioUrls.length > 1) ? String(idx + 1) : '';
      fileRows.push({ label: a.name + '_포트폴리오' + suffix + (getFileExt(url) || ''), url: url, badge: '포트폴리오' });
    });
    (a.mentorPortfolioUrls || []).forEach(function (url, idx) {
      var mSuffix = (a.mentorPortfolioUrls.length > 1) ? String(idx + 1) : '';
      fileRows.push({ label: a.name + '_발표자료' + mSuffix + (getFileExt(url) || ''), url: url, badge: '발표자료' });
    });

    var metaParts = [];
    if (a.resumeUrl) metaParts.push('이력서 1개');
    if ((a.portfolioUrls || []).length) metaParts.push('포트폴리오 ' + a.portfolioUrls.length + '개');
    if ((a.mentorPortfolioUrls || []).length) metaParts.push('발표자료 ' + a.mentorPortfolioUrls.length + '개');
    if (metaParts.length === 0) metaParts.push('첨부된 파일 없음');

    var attachRowsHtml = fileRows.map(function (f) {
      return '' +
        '<div class="attach-box">' +
          '<div class="attach-file">' +
            '<span class="badge badge--file">' + esc(f.badge) + '</span>' +
            '<div class="attach-info"><span class="fname">' + esc(f.label) + '</span></div>' +
          '</div>' +
          '<div class="attach-actions">' +
            '<button type="button" class="resume-btn file-preview-btn" data-url="' + esc(f.url) + '" data-label="' + esc(f.label) + '">' +
              '<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M2 12C4 7 8 4.5 12 4.5C16 4.5 20 7 22 12C20 17 16 19.5 12 19.5C8 19.5 4 17 2 12Z" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="2.6" stroke="currentColor" stroke-width="1.6"/></svg>' +
              '미리보기' +
            '</button>' +
            '<button type="button" class="resume-btn file-download-btn" data-url="' + esc(f.url) + '" data-label="' + esc(f.label) + '">' +
              '<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 3V15M12 15L7 10M12 15L17 10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 17V19C4 20.1 4.9 21 6 21H18C19.1 21 20 20.1 20 19V17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>' +
              '다운로드' +
            '</button>' +
          '</div>' +
        '</div>';
    }).join('');

    return '' +
      '<dl class="card-grid">' +
        '<dt>이메일</dt><dd>' + esc(a.email) + '</dd>' +
        '<dt>연락처</dt><dd>' + esc(a.phone) + '</dd>' +
        '<dt>생년월일</dt><dd>' + esc(a.birth) + '</dd>' +
        '<dt>연차</dt><dd>' + esc(a.year) + '</dd>' +
      '</dl>' +
      (textBlock ? '<dl class="card-text">' + textBlock + '</dl>' : '') +
      (mentorBlock ? '<dl class="card-text">' + mentorBlock + '</dl>' : '') +
      '<div class="card-attach">' +
        '<span class="attach-summary">' + metaParts.join(' · ') + '</span>' +
        attachRowsHtml +
        (fileRows.length > 1 ?
          '<button type="button" class="download-all-btn" data-files=\'' + esc(JSON.stringify(fileRows.map(function (f) { return { url: f.url, label: f.label }; }))) + '\'>' +
            '전체 파일 다운로드 (' + fileRows.length + '개)' +
          '</button>'
        : '') +
      '</div>';
  }

  // 현재 선택된 멘토 필터가 적용된 리스트를 돌려줌 (화면 렌더링과 엑셀 다운로드가 같이 씀)
  function getFilteredList() {
    var list = allApplications;
    if (activeMentor) {
      list = list.filter(function (a) { return a.mentor === activeMentor; });
    }
    return list;
  }

  function render() {
    var list = getFilteredList();

    var cardList = document.getElementById('cardList');
    var emptyMsg = document.getElementById('emptyMsg');

    if (list.length === 0) {
      cardList.innerHTML = '';
      emptyMsg.style.display = 'block';
      return;
    }
    emptyMsg.style.display = 'none';

    // 카드에는 요약만 보이고(멘토/요일 포함), 클릭하면 전체 상세정보 모달이 열림
    cardList.innerHTML = list.map(function (a) {
      var fieldTags = (a.fields || []).map(function (f) { return '<span class="tag">' + esc(f) + '</span>'; }).join('');

      var yearLabel = a.year === '신입' ? '신입' : (a.year ? a.year + '년차' : '');
      var metaLine = a.mentor ? (a.mentor + (a.day ? ' · ' + a.day : '')) : '멘토 미선택';

      return '' +
        '<div class="card" data-id="' + esc(a.id) + '">' +
          '<div class="card-thumb-wrap">' +
            (a.portfolioThumbnailUrl
              ? '<img class="card-thumb" src="' + esc(a.portfolioThumbnailUrl) + '" alt="' + esc(a.name) + ' 포트폴리오 썸네일">'
              : '<div class="card-thumb--empty"><svg width="26" height="26" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.6"/><circle cx="8.5" cy="9.5" r="1.5" stroke="currentColor" stroke-width="1.6"/><path d="M21 15L16 10L7 19" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>') +
          '</div>' +
          '<div class="card-body">' +
            '<div class="card-head">' +
              (yearLabel ? '<span class="badge badge--year">' + esc(yearLabel) + '</span>' : '') +
              '<span class="card-name">' + esc(a.name) + '</span>' +
            '</div>' +
            '<div class="card-chips">' + fieldTags + '</div>' +
            (metaLine ? '<div class="card-meta">' + esc(metaLine) + '</div>' : '') +
            (a.summary ? '<div class="card-summary">' + esc(a.summary) + '</div>' : '') +
          '</div>' +
        '</div>';
    }).join('');
  }

  // ============================================
  // 지원자 상세정보 모달
  // ============================================
  var detailModal = document.getElementById('detailModal');
  var detailName = document.getElementById('detailName');
  var detailBody = document.getElementById('detailBody');

  function openDetail(id) {
    var a = allApplications.find(function (item) { return item.id === id; });
    if (!a) return;
    var yearLabel = a.year === '신입' ? '신입' : (a.year ? a.year + '년차' : '');
    detailName.innerHTML =
      (yearLabel ? '<span class="badge badge--year">' + esc(yearLabel) + '</span> ' : '') +
      esc(a.name);
    detailBody.innerHTML = buildDetailHtml(a);
    detailModal.classList.add('open');
  }
  function closeDetailModal() { detailModal.classList.remove('open'); }
  document.getElementById('detailCloseBtn').addEventListener('click', closeDetailModal);
  detailModal.addEventListener('click', function (e) {
    if (e.target === detailModal) closeDetailModal();
  });

  document.getElementById('cardList').addEventListener('click', function (e) {
    var card = e.target.closest('.card');
    if (card) openDetail(card.dataset.id);
  });

  // ============================================
  // 이력서/포트폴리오/발표자료 미리보기 모달 - 셋 다 같은 방식으로 열림
  // 새 창/다운로드는 fetch 없이 단순 링크 방식 (Storage 파일이라 그냥 열어도 안전하고, CORS 문제도 없음)
  // ============================================
  var resumeModal = document.getElementById('resumeModal');
  var modalName = document.getElementById('modalName');
  var modalFile = document.getElementById('modalFile');
  var modalBody = document.getElementById('modalBody');
  var modalOpenBtn = document.getElementById('modalOpenBtn');
  var modalDownloadBtn = document.getElementById('modalDownloadBtn');

  function openPreview(url, label) {
    modalName.textContent = '파일 미리보기';
    modalFile.textContent = label;
    modalBody.innerHTML = '<iframe class="modal-pdf" src="' + esc(url) + '"></iframe>';
    modalOpenBtn.disabled = false;
    modalDownloadBtn.disabled = false;
    modalOpenBtn.onclick = function () { window.open(url, '_blank'); };
    modalDownloadBtn.onclick = function () { downloadFile(url, label); };
    resumeModal.classList.add('open');
  }

  // 상세 모달 안의 미리보기/전체다운로드 버튼은 문서 전체 기준으로 감지 (detailModal이 cardList 밖에 있어서)
  document.body.addEventListener('click', function (e) {
    var previewBtn = e.target.closest('.file-preview-btn');
    if (previewBtn) {
      openPreview(previewBtn.dataset.url, previewBtn.dataset.label);
      return;
    }

    var downloadBtn = e.target.closest('.file-download-btn');
    if (downloadBtn) {
      downloadFile(downloadBtn.dataset.url, downloadBtn.dataset.label);
      return;
    }

    var downloadAllBtn = e.target.closest('.download-all-btn');
    if (downloadAllBtn) {
      var files = JSON.parse(downloadAllBtn.dataset.files);
      files.forEach(function (f, i) {
        setTimeout(function () { downloadFile(f.url, f.label); }, i * 400);
      });
    }
  });

  function closeResumeModal() { resumeModal.classList.remove('open'); }
  document.getElementById('modalCloseBtn').addEventListener('click', closeResumeModal);
  resumeModal.addEventListener('click', function (e) {
    if (e.target === resumeModal) closeResumeModal();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closeResumeModal(); closeDetailModal(); }
  });
</script>

</body>
</html>
